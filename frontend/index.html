    <!-- Initial-load splash: pure HTML/CSS, lives inside #root so React's
         createRoot() removes it the moment the app mounts. Colors follow the
         OS light/dark preference and match the app theme's background values
         (see --background in src/styles). The short fade-in delay keeps it
         from flickering on fast cached loads. -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        color: #5a665c;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        opacity: 0;
        animation: splash-appear 0.4s ease-out 0.15s forwards;
      }
      .splash-spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(63, 145, 66, 0.2);
        border-top-color: #3f9142;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-appear {
        to {
          opacity: 1;
        }
      }
      @media (prefers-color-scheme: dark) {
        .splash {
          background: oklch(0.145 0 0);
          color: #9aa39b;
        }
        .splash-spinner {
          border-color: rgba(87, 174, 91, 0.25);
          border-top-color: #57ae5b;
        }
      }
    </style>

    <!-- Structured data -->
    <script type="application/ld+json">
